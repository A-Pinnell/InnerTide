<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="developer-tools" id="developerTools" hidden>
    <section class="developer-tools-panel">
        <div class="developer-tools-heading">
            <h2>Developer Tools</h2>
            <button class="developer-tools-close" id="developerToolsClose" type="button">Close</button>
        </div>
        <p class="developer-tools-status" id="developerToolsStatus"></p>

        <section class="developer-tool-section">
            <h3>Tasks and Coins</h3>
            <button class="developer-tool-action" id="developerResetTasks" type="button">Reset Current Tasks</button>
            <form id="developerCoinsForm">
                <label for="developerCoinAmount">Coin amount (0-999)</label>
                <div class="developer-tools-inline">
                    <input id="developerCoinAmount" type="number" min="0" max="999" step="1" required>
                    <button class="developer-tool-action" type="submit">Set Coins</button>
                </div>
            </form>
        </section>

        <section class="developer-tool-section">
            <h3>Aquarium Progress</h3>
            <label class="developer-progress-limit-toggle">
                <input id="developerDisableProgressLimit" type="checkbox">
                <span>Disable the 100% progress limit for creating another aquarium</span>
            </label>
        </section>

        <section class="developer-tool-section">
            <h3>Aquarium Inventory</h3>
            <div class="developer-inventory-tabs">
                <button class="developer-inventory-tab active" type="button" data-inventory-category="fish">Fish</button>
                <button class="developer-inventory-tab" type="button" data-inventory-category="items">Objects</button>
            </div>
            <div class="developer-inventory-list" id="developerInventoryList"></div>
            <button class="developer-tool-action" id="developerSaveInventory" type="button">Save Inventory</button>
        </section>

        <section class="developer-tool-section">
            <h3>Fish in Aquariums</h3>
            <div class="developer-inventory-list" id="developerAquariumFishList"></div>
            <button class="developer-tool-action" id="developerClearAquariumFish" type="button">Remove All Fish from Aquariums</button>
        </section>
    </section>
</div>

<style>
    .developer-tools[hidden] {
        display: none;
    }

    .developer-tools {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(5, 24, 46, .72);
        backdrop-filter: blur(5px);
    }

    .developer-tools-panel {
        display: flex;
        width: min(680px, 100%);
        max-height: min(88vh, 860px);
        flex-direction: column;
        gap: 16px;
        overflow-x: hidden;
        overflow-y: auto;
        padding: clamp(18px, 4vw, 32px);
        border: 5px solid rgba(195, 250, 255, .96);
        border-radius: 28px;
        background: linear-gradient(145deg, #16385f, #087b9f);
        box-shadow: 0 12px 40px rgba(0, 0, 0, .45), inset 0 0 18px rgba(255,255,255,.16);
        color: #fff;
    }

    .developer-tools-heading,
    .developer-tools-inline,
    .developer-inventory-tabs {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .developer-tools-heading h2,
    .developer-tool-section h3 {
        margin: 0;
        font-family: "Aquino", "Neuropolx", sans-serif;
    }

    .developer-tools-heading h2 {
        font-size: clamp(24px, 4vw, 36px);
    }

    .developer-tools-close,
    .developer-tool-action,
    .developer-inventory-tab {
        min-height: 42px;
        padding: 8px 14px;
        border: 2px solid rgba(255,255,255,.82);
        border-radius: 12px;
        background: linear-gradient(180deg, #20bce4, #087daf);
        color: #fff;
        font: inherit;
        cursor: pointer;
    }

    .developer-tools-status {
        min-height: 1.3em;
        margin: 0;
        color: #d7fff1;
    }

    .developer-tools-status.has-error {
        color: #ffd1d1;
    }

    .developer-tool-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border: 2px solid rgba(255,255,255,.42);
        border-radius: 18px;
        background: rgba(255,255,255,.1);
    }

    .developer-tool-section h3 {
        font-size: 22px;
    }

    .developer-tools-inline input {
        width: 110px;
        min-height: 42px;
        padding: 6px 10px;
        border: 2px solid rgba(255,255,255,.75);
        border-radius: 10px;
        background: rgba(255,255,255,.94);
        color: #16385f;
        font: inherit;
    }

    .developer-progress-limit-toggle {
        display: flex;
        align-items: flex-start;
        gap: 10px;
    }

    .developer-progress-limit-toggle input {
        margin-top: 4px;
    }

    .developer-inventory-tabs {
        justify-content: flex-start;
    }

    .developer-inventory-tab.active {
        background: linear-gradient(180deg, #69d7f0, #1688c0);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.4);
    }

    .developer-inventory-list {
        display: grid;
        max-height: 230px;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 8px;
        overflow: auto;
        padding: 4px;
    }

    .developer-inventory-entry {
        display: flex;
        min-width: 0;
        min-height: 54px;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 12px;
        background: rgba(0, 30, 58, .24);
        cursor: pointer;
    }

    .developer-inventory-entry input {
        flex: 0 0 auto;
        accent-color: #24c1e4;
    }

    .developer-inventory-entry img {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        object-fit: contain;
    }

    .developer-aquarium-fish-entry {
        display: flex;
        min-width: 0;
        min-height: 54px;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 12px;
        background: rgba(0, 30, 58, .24);
    }

    .developer-aquarium-fish-entry img {
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        object-fit: contain;
    }

    .developer-aquarium-fish-copy {
        display: grid;
        min-width: 0;
        gap: 3px;
    }

    .developer-aquarium-fish-copy small {
        color: rgba(255,255,255,.8);
        font: 12px/1.3 Arial, sans-serif;
    }
</style>

<script>
    let DeveloperMode = 0;

    (() => {
        const panel = document.querySelector("#developerTools");
        if (!panel) return;
        if (DeveloperMode === 0) {
            panel.remove();
            return;
        }

        const closeButton = document.querySelector("#developerToolsClose");
        const status = document.querySelector("#developerToolsStatus");
        const inventoryList = document.querySelector("#developerInventoryList");
        const saveInventoryButton = document.querySelector("#developerSaveInventory");
        const aquariumFishList = document.querySelector("#developerAquariumFishList");
        const clearAquariumFishButton = document.querySelector("#developerClearAquariumFish");
        const progressLimitToggle = document.querySelector("#developerDisableProgressLimit");
        const inventoryTabs = [...panel.querySelectorAll("[data-inventory-category]")];
        const csrfToken = document.querySelector('#developerToolsHost input[name="__RequestVerificationToken"]')?.value;
        const inventoryData = {
            fish: { catalog: [], owned: [], endpoint: "/DeveloperTools/SetFish" },
            items: { catalog: [], owned: [], endpoint: "/DeveloperTools/SetItems" }
        };
        let activeInventoryCategory = "fish";
        let inventoryLoaded = false;
        let typedCharacters = "";
        function setDeveloperStatus(message, isError = false) {
            status.textContent = message;
            status.classList.toggle("has-error", isError);
        }

        function closeDeveloperTools() {
            panel.hidden = true;
            typedCharacters = "";
        }

        async function postDeveloperAction(url, body) {
            const headers = { "RequestVerificationToken": csrfToken };
            const options = { method: "POST", headers };
            if (body !== undefined) {
                headers["Content-Type"] = "application/json";
                options.body = JSON.stringify(body);
            }

            const response = await fetch(url, options);
            if (!response.ok) {
                const details = await response.text();
                throw new Error(details || `Request failed (${response.status}).`);
            }
            return response;
        }

        function renderDeveloperInventory() {
            const inventory = inventoryData[activeInventoryCategory];
            inventoryList.replaceChildren();

            if (inventory.catalog.length === 0) {
                inventoryList.textContent = "No catalog entries found.";
                return;
            }

            inventory.catalog.forEach(entry => {
                const id = entry._id || entry.fishId || entry.itemId;
                const name = activeInventoryCategory === "fish" ? entry.species : entry.name;
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = id;
                checkbox.checked = inventory.owned.includes(id);

                const image = document.createElement("img");
                image.src = entry.sprite;
                image.alt = "";
                image.loading = "lazy";

                const label = document.createElement("label");
                label.className = "developer-inventory-entry";
                label.append(checkbox, image, document.createTextNode(name || id));
                inventoryList.append(label);
            });
        }

        async function loadDeveloperInventory() {
            setDeveloperStatus("Loading Aquarium inventory...");
            const responses = await Promise.all([
                fetch("/Aquarium/GetAllFish"),
                fetch("/Aquarium/GetUserFish"),
                fetch("/Aquarium/GetAllItems"),
                fetch("/Aquarium/GetUserItems")
            ]);
            if (responses.some(response => !response.ok)) {
                throw new Error("Unable to load Aquarium catalogs or current inventory.");
            }

            const [fishCatalog, ownedFish, itemCatalog, ownedItems] = await Promise.all(
                responses.map(response => response.json())
            );
            inventoryData.fish.catalog = fishCatalog;
            inventoryData.fish.owned = ownedFish.map(fish => fish._id || fish.fishId);
            inventoryData.items.catalog = itemCatalog;
            inventoryData.items.owned = ownedItems.map(item => item._id || item.itemId);
            inventoryLoaded = true;
            renderDeveloperInventory();
            setDeveloperStatus("Inventory loaded.");
        }

        async function loadDeveloperAquariumFish() {
            aquariumFishList.textContent = "Loading fish in aquariums...";
            const response = await fetch("/DeveloperTools/GetAquariumFish");
            if (!response.ok) {
                const details = await response.text();
                throw new Error(details || `Unable to load aquarium fish (${response.status}).`);
            }

            const fish = await response.json();
            aquariumFishList.replaceChildren();
            if (fish.length === 0) {
                aquariumFishList.textContent = "No fish are currently in your aquariums.";
                return;
            }

            fish.forEach(entry => {
                const row = document.createElement("div");
                row.className = "developer-aquarium-fish-entry";
                if (entry.sprite) {
                    const image = document.createElement("img");
                    image.src = entry.sprite;
                    image.alt = "";
                    image.loading = "lazy";
                    row.append(image);
                }

                const copy = document.createElement("span");
                copy.className = "developer-aquarium-fish-copy";
                const species = document.createElement("strong");
                species.textContent = entry.species;
                const location = document.createElement("small");
                location.textContent = `Aquarium ${entry.aquariumNumber || "unknown"}`;
                copy.append(species, location);
                row.append(copy);
                aquariumFishList.append(row);
            });
        }

        async function loadAquariumProgressLimit() {
            const response = await fetch("/DeveloperTools/GetAquariumProgressLimit");
            if (!response.ok) {
                const details = await response.text();
                throw new Error(details || `Unable to load aquarium progress settings (${response.status}).`);
            }

            const setting = await response.json();
            if (!setting.available) {
                progressLimitToggle.closest(".developer-tool-section").remove();
                return;
            }
            progressLimitToggle.checked = setting.disabled;
        }

        async function loadDeveloperToolsData() {
            await Promise.all([
                loadDeveloperInventory(),
                loadDeveloperAquariumFish(),
                loadAquariumProgressLimit()
            ]);
        }

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && !panel.hidden) {
                closeDeveloperTools();
                return;
            }

            if (panel.hidden && !event.ctrlKey && !event.altKey && !event.metaKey &&
                !(event.target instanceof HTMLElement && (
                    event.target.isContentEditable ||
                    ["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)
                ))) {
                if (/^[a-z]$/i.test(event.key)) {
                    typedCharacters = (typedCharacters + event.key.toLowerCase()).slice(-3);
                    if (typedCharacters === "dev") {
                        panel.hidden = false;
                        document.querySelector("#developerCoinAmount").value = coinCount?.textContent.trim() || "0";
                        loadDeveloperToolsData().catch(error => {
                            console.error(error);
                            setDeveloperStatus(error.message, true);
                        });
                    }
                } else {
                    typedCharacters = "";
                }
            }
        });

        closeButton.addEventListener("click", closeDeveloperTools);
        panel.addEventListener("click", event => {
            if (event.target === panel) closeDeveloperTools();
        });

        document.querySelector("#developerResetTasks").addEventListener("click", async () => {
            try {
                await postDeveloperAction("/DeveloperTools/ResetTasks");
                await getTaskData();
                setDeveloperStatus("Current tasks have been reset.");
            } catch (error) {
                console.error(error);
                setDeveloperStatus(error.message, true);
            }
        });

        document.querySelector("#developerCoinsForm").addEventListener("submit", async event => {
            event.preventDefault();
            const amount = Number(document.querySelector("#developerCoinAmount").value);
            if (!Number.isInteger(amount) || amount < 0 || amount > 999) {
                setDeveloperStatus("Coin amount must be a whole number from 0 to 999.", true);
                return;
            }

            try {
                await postDeveloperAction("/DeveloperTools/SetCoins", { amount });
                await loadCoinBalance();
                setDeveloperStatus(`Coin amount set to ${amount}.`);
            } catch (error) {
                console.error(error);
                setDeveloperStatus(error.message, true);
            }
        });

        progressLimitToggle.addEventListener("change", async () => {
            progressLimitToggle.disabled = true;
            try {
                const response = await postDeveloperAction(
                    "/DeveloperTools/SetAquariumProgressLimit",
                    { disabled: progressLimitToggle.checked }
                );
                const setting = await response.json();
                progressLimitToggle.checked = setting.disabled;
                setDeveloperStatus(setting.disabled
                    ? "Aquarium progress limit disabled."
                    : "Aquarium progress limit enabled.");
            } catch (error) {
                console.error(error);
                progressLimitToggle.checked = !progressLimitToggle.checked;
                setDeveloperStatus(error.message, true);
            } finally {
                progressLimitToggle.disabled = false;
            }
        });

        inventoryTabs.forEach(tab => {
            tab.addEventListener("click", () => {
                activeInventoryCategory = tab.dataset.inventoryCategory;
                inventoryTabs.forEach(item => item.classList.toggle("active", item === tab));
                renderDeveloperInventory();
            });
        });

        saveInventoryButton.addEventListener("click", async () => {
            if (!inventoryLoaded) {
                setDeveloperStatus("Wait for the inventory to finish loading.", true);
                return;
            }

            const ids = [...inventoryList.querySelectorAll('input[type="checkbox"]:checked')]
                .map(checkbox => checkbox.value);
            const inventory = inventoryData[activeInventoryCategory];
            try {
                await postDeveloperAction(inventory.endpoint, { ids });
                inventory.owned = ids;
                if (document.body.classList.contains("aquarium-page")) {
                    renderInventoryFish();
                    renderInventoryItems();
                }
                setDeveloperStatus(`${activeInventoryCategory === "fish" ? "Fish" : "Objects"} inventory saved.`);
            } catch (error) {
                console.error(error);
                setDeveloperStatus(error.message, true);
            }
        });

        clearAquariumFishButton.addEventListener("click", async () => {
            if (!window.confirm("Remove all fish from every aquarium? They will be returned to your fish inventory.")) {
                return;
            }

            clearAquariumFishButton.disabled = true;
            try {
                const response = await postDeveloperAction("/DeveloperTools/ClearAquariumFish");
                const result = await response.json();
                await Promise.all([loadDeveloperInventory(), loadDeveloperAquariumFish()]);
                if (document.body.classList.contains("aquarium-page") && typeof window.renderAquariumFish === "function") {
                    await window.renderAquariumFish();
                }
                setDeveloperStatus(`${result.removed} fish returned to inventory.`);
            } catch (error) {
                console.error(error);
                setDeveloperStatus(error.message, true);
            } finally {
                clearAquariumFishButton.disabled = false;
            }
        });
    })();
</script>
</body>
</html>
